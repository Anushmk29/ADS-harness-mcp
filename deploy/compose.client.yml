# One client = one copy of this file in /srv/harness/clients/<slug>/compose.yml.
# HOST_PORT and IMAGE come from that folder's .env (compose reads it for interpolation).
services:
  harness:
    image: ${IMAGE:-marketing-harness:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      - HOST=0.0.0.0
      - PORT=3333
      - NODE_ENV=production
      - DATA_DIR=/app/.marketing-data
    ports:
      - "127.0.0.1:${HOST_PORT}:3333"   # only Caddy on the host reaches it
    volumes:
      - ./config:/app/config
      - ./data:/app/.marketing-data
    mem_limit: 768m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3333/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
