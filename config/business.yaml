    - Dominate Google Search and Organic SEO for 'WhatsApp AI agent business
      automation' and 'dental front desk automation'
    - Build thought leadership and pipeline via LinkedIn and Meta targeted
      campaigns in India, UK, US, SE Asia, and the Gulf
  primaryKPIs:
    monthlyQualifiedLeads: 20
    targetBlendedCAC: 20000
    mqlToSqlRatePercent: 40
    targetROAS: 5.5
  secondaryKPIs:
    organicSearchTrafficGrowthMoM: 25
    emailNurtureClickToMeetingRatePercent: 12
    metaAdCTRPercent: 2.4
    googleSearchImpressionSharePercent: 70
  monthlyBudget:
    total: 150000
    currency: INR
    allocations:
      google_ads: 60000
      meta_ads: 45000
      content_and_seo: 30000
      email_and_crm_tools: 15000
  channels:
    - google_search
    - meta_ads
    - linkedin_organic_and_ads
    - organic_seo
    - email_nurture
    - whatsapp_inbound_funnel
