version: "3.9"

services:
  marketing-harness:
    build: .
    container_name: marketing-harness
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      - HOST=0.0.0.0
      - PORT=3333
    volumes:
      # Persist the 10-tier memory snapshot across deploys/restarts
      - ./config:/app/config:ro
      - marketing-data:/app/.marketing-data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3333/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  marketing-data:
